# Calc — прод-конфиг Nginx (после certbot / обновление через ./deploy.sh)
# Файл на сервере: /etc/nginx/sites-available/calc
# Не трогать чужие sites-*.

upstream pocketbase_calc {
    server 127.0.0.1:8095;
    keepalive 32;
}

server {
    listen 80;
    server_name calc.loomixx.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name calc.loomixx.ru;

    ssl_certificate     /etc/letsencrypt/live/calc.loomixx.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calc.loomixx.ru/privkey.pem;
    # эти файлы ставит certbot (общие для всех сайтов на VPS)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/calc/dist;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
    }
    location ~* ^/workbox-[^/]+\.js$ {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    location /api/ {
        proxy_pass http://pocketbase_calc/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    location /_/ {
        proxy_pass http://pocketbase_calc/_/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
